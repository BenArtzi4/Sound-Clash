name: Catalog Backup

# Disaster-recovery safety net for the durable song catalog (genres, songs,
# song_genres) -- see docs/runbook.md §6.
#
# Weekly (Mon 04:17 UTC) and on manual dispatch, this dumps the three catalog
# tables from PROD to deterministic CSVs, encrypts them with a passphrase
# (AES-256, gpg symmetric) and keeps the result as a workflow artifact for 90
# days. Nothing is committed to the repo: the repo is public and the curated
# catalog (YouTube ids + start times) is the product's core asset, so the dump
# must not be readable by anyone who can see the repo or its artifacts.
# Restore: download the artifact, decrypt it into db/backups/, run
# db/backups/restore.sql (idempotent) -- the exact commands are in the runbook.
#
# Secrets (prod environment): SUPABASE_DATABASE_URL (same one db-migrate.yml
# uses) and CATALOG_BACKUP_PASSPHRASE (held by the maintainer).

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, encrypt and store the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump catalog to deterministic CSVs
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PGTZ: UTC # deterministic timestamptz rendering
          PGCLIENTENCODING: UTF8 # Hebrew titles are UTF-8
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::SUPABASE_DATABASE_URL not set for the prod environment"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/catalog"
          dump() {
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              -c "\copy ($1) TO STDOUT WITH (FORMAT csv, HEADER true)" > "$RUNNER_TEMP/catalog/$2.csv"
          }
          dump "SELECT * FROM genres ORDER BY id"                     genres
          dump "SELECT * FROM songs ORDER BY id"                      songs
          dump "SELECT * FROM song_genres ORDER BY song_id, genre_id" song_genres
          cd "$RUNNER_TEMP/catalog"
          g=$(( $(wc -l < genres.csv) - 1 ))
          s=$(( $(wc -l < songs.csv) - 1 ))
          sg=$(( $(wc -l < song_genres.csv) - 1 ))
          echo "Dumped: genres=$g songs=$s song_genres=$sg"
          # Guard: a partial/empty read must never replace a good backup.
          if [ "$g" -lt 5 ] || [ "$s" -lt 100 ] || [ "$sg" -lt 100 ]; then
            echo "::error::Implausibly small dump (genres=$g songs=$s song_genres=$sg); refusing to store it. Check prod."
            exit 1
          fi
          {
            echo "### Catalog backup $(date -u +%F)"
            echo ""
            echo "| table | rows | sha256 |"
            echo "|---|---|---|"
            for t in genres songs song_genres; do
              echo "| $t | $(( $(wc -l < $t.csv) - 1 )) | \`$(sha256sum $t.csv | cut -c1-16)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.CATALOG_BACKUP_PASSPHRASE }}
        run: |
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "::error::CATALOG_BACKUP_PASSPHRASE not set for the prod environment; refusing to store an unencrypted dump"
            exit 1
          fi
          cd "$RUNNER_TEMP"
          tar -C catalog -czf catalog.tar.gz genres.csv songs.csv song_genres.csv
          out="catalog-$(date -u +%F).tar.gz.gpg"
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o "$out" catalog.tar.gz
          rm -rf catalog catalog.tar.gz
          echo "ARCHIVE=$RUNNER_TEMP/$out" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=catalog-backup-$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Store as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE }}
          retention-days: 90
          if-no-files-found: error
