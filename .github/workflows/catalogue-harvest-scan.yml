name: Catalogue Harvest Scan

# Watches for a script copying the song catalogue by "playing" games.
#
# The browser can only get a song's YouTube id and start time by playing it,
# so a script that wants the whole catalogue has to walk select_next_song
# round after round. Real rooms look different (game_history, Nov 2026):
# games with no team stop by 49 rounds, games with one team by 22, and rooms
# with two or more teams play up to ~260. So this flags, among non-test games
# archived in the look-back window:
#   - a game with at most one team and MIN_ROUNDS+ rounds,
#   - any game with MAX_ROUNDS+ rounds,
#   - games with at most one team adding up to DAY_TOTAL+ rounds.
# Findings open one issue labelled catalogue-harvest (or comment on the open
# one, skipping games it already lists). Nothing is changed in the database.
#
# Secrets (prod environment): SUPABASE_DATABASE_URL.

on:
  schedule:
    - cron: "41 6 * * *" # daily
  workflow_dispatch:
    inputs:
      hours:
        description: "Look-back window in hours"
        default: "26"
      dry_run:
        description: "Only print the findings; don't open or comment on an issue"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: catalogue-harvest-scan
  cancel-in-progress: false

jobs:
  scan:
    name: Look for song-collecting games
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HOURS: ${{ inputs.hours || '26' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      MIN_ROUNDS: "80"
      MAX_ROUNDS: "350"
      DAY_TOTAL: "300"
    steps:
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Find suspicious games
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
          PGTZ: UTC
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::SUPABASE_DATABASE_URL not set for the prod environment"
            exit 1
          fi
          if ! [[ "$HOURS" =~ ^[0-9]{1,3}$ ]] || [ "$HOURS" -lt 1 ]; then
            echo "::error::hours must be a whole number from 1 to 999 (got '$HOURS')"
            exit 1
          fi
          # code, start (UTC), rounds, teams for every non-test game archived in the window
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F $'\t' -c "
            SELECT game_code, to_char(started_at, 'YYYY-MM-DD HH24:MI'), round_count, team_count
            FROM game_history
            WHERE NOT is_test AND archived_at > now() - interval '$HOURS hours'
            ORDER BY archived_at" > games.tsv
          awk -F'\t' -v min="$MIN_ROUNDS" -v max="$MAX_ROUNDS" -v day="$DAY_TOTAL" '
            $4 <= 1 { total += $3; few[NR] = $0 }
            ($4 <= 1 && $3 >= min) || $3 >= max { print > "flagged.tsv"; flagged++ }
            END {
              if (!flagged && total >= day) for (i in few) { print few[i] > "flagged.tsv"; flagged++ }
              printf "games=%d few_team_rounds=%d flagged=%d\n", NR, total, flagged
            }' games.tsv | tee counts.txt
          touch flagged.tsv
          {
            echo "### Catalogue harvest scan $(date -u +%F)"
            echo ""
            echo "Last $HOURS h: $(cat counts.txt). Rules: <=1 team and >=$MIN_ROUNDS rounds, any game >=$MAX_ROUNDS rounds, or <=1-team games adding up to >=$DAY_TOTAL rounds."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the issue
        run: |
          set -euo pipefail
          if [ ! -s flagged.tsv ]; then
            echo "Nothing suspicious."
            exit 0
          fi
          issue=$(gh issue list --label catalogue-harvest --state open --json number --jq '.[0].number // empty')
          seen=""
          if [ -n "$issue" ]; then
            seen=$(gh issue view "$issue" --json body,comments --jq '.body, .comments[].body')
          fi
          : > new.tsv
          while IFS=$'\t' read -r code start rounds teams; do
            if ! grep -q "\`$code\`" <<< "$seen"; then
              printf '%s\t%s\t%s\t%s\n' "$code" "$start" "$rounds" "$teams" >> new.tsv
            fi
          done < flagged.tsv
          if [ ! -s new.tsv ]; then
            echo "Every flagged game is already listed on issue #$issue."
            exit 0
          fi
          {
            echo "| game | started (UTC) | rounds | teams |"
            echo "|---|---|---|---|"
            awk -F'\t' '{ printf "| `%s` | %s | %s | %s |\n", $1, $2, $3, $4 }' new.tsv
          } > table.md
          if [ "$DRY_RUN" = "true" ]; then
            echo "::group::[dry-run] findings (no issue created or edited)"
            cat table.md
            echo "::endgroup::"
            exit 0
          fi
          if [ -n "$issue" ]; then
            { echo "Scan $(date -u +%F) found more games:"; echo ""; cat table.md; } > comment.md
            gh issue comment "$issue" --body-file comment.md
          else
            {
              echo "The daily scan found games that look like a script collecting the song list: many rounds with no team or one team. Real rooms with so few teams stop much earlier."
              echo ""
              cat table.md
              echo ""
              echo "**What to do:** look the games up with \`/recent-games\` or in \`game_history\`. Our own test games are marked \`is_test\` and never show here. If it is a script, tell Claude; nothing was changed automatically."
            } > body.md
            gh label create catalogue-harvest --color B60205 --description "Possible scripted copying of the song catalogue" 2>/dev/null || true
            gh issue create --title "Possible song-catalogue harvesting (auto)" --label catalogue-harvest --body-file body.md
          fi
