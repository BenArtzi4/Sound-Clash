# Weekly video health scan (I-Liveness Phase 2, issue #248).
#
# 1. Pages the whole catalog through POST /admin/songs/check-availability with
#    commit=true. A video YouTube confirms deleted (oEmbed 404), private (403)
#    or embed-disabled (401) gets flagged and the round pickers skip it
#    (mig 045); a flagged video that answers 200 again is restored; ambiguous
#    probes (400/429/5xx/timeout) never write. The endpoint re-probes a
#    known-good canary video before trusting a page of bad verdicts, so a
#    YouTube-side block on the backend's IP can't take the catalog offline.
# 2. Reads the last 7 days of real in-game player failures from Grafana Loki
#    (Faro warn logs yt_player_error / yt_preload_error, which carry the
#    failing song's title, artist, youtube_id and URL). These catch what no
#    server-side probe can see, e.g. a copyright claim blocking embeds.
# 3. Maintains ONE canonical issue (label: dead-videos): created or updated
#    while anything is wrong, closed automatically once everything is clean.
#
# Needs the ADMIN_PASSWORD repo secret (the same X-Admin-Password the admin
# song catalog uses); a missing secret fails fast. GRAFANA_READ_TOKEN (Viewer
# service-account token, shared with stale-buzz-lock-scan.yml) enables step 2;
# without it the in-game section is skipped with a warning.
#
# Test without side effects: Run workflow -> dry_run=true probes report-only
# (commit=false) and prints the issue body instead of touching issues.

name: Dead video scan

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, off the top-of-hour rush
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report only: flag nothing and print the issue instead of filing it"
        type: boolean
        default: false

permissions:
  issues: write

concurrency:
  group: dead-video-scan

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scan the catalog and in-game failures, sync the dead-videos issue
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          API: https://api.soundclash.org
          GRAFANA_URL: https://prudentcurrant2518.grafana.net
          LOKI_DS_UID: grafanacloud-logs
          LOOKBACK_DAYS: "7"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::ADMIN_PASSWORD secret is not set"
            exit 1
          fi
          commit=true
          [ "$DRY_RUN" = "true" ] && commit=false

          # --- 1. catalog probe --------------------------------------------
          offset=0 checked=0 flagged=0 cleared=0 canary_pages=0
          : > dead.jsonl
          : > unplayable.jsonl
          : > unknown.jsonl
          # 40 pages x 250 songs = 10k headroom; the catalog is ~1.4k.
          for page in $(seq 1 40); do
            body=$(jq -nc --argjson o "$offset" --argjson c "$commit" '{limit: 250, offset: $o, commit: $c}')
            # POST is safe to retry: flag/clear are idempotent. Generous
            # timeout + retries ride out a Render cold start.
            resp=$(curl -sS --fail-with-body --max-time 180 \
              --retry 3 --retry-delay 30 --retry-all-errors \
              -H "X-Admin-Password: $ADMIN_PASSWORD" \
              -H "Content-Type: application/json" \
              -d "$body" "$API/admin/songs/check-availability")
            jq -c '.dead[]' <<<"$resp" >> dead.jsonl
            jq -c '(.unplayable // [])[]' <<<"$resp" >> unplayable.jsonl
            jq -c '.unknown[]' <<<"$resp" >> unknown.jsonl
            checked=$((checked + $(jq -r '.checked' <<<"$resp")))
            flagged=$((flagged + $(jq -r '.flagged' <<<"$resp")))
            cleared=$((cleared + $(jq -r '.cleared' <<<"$resp")))
            if [ "$(jq -r '.canary_failed // false' <<<"$resp")" = "true" ]; then
              canary_pages=$((canary_pages + 1))
            fi
            next=$(jq -r '.next_offset' <<<"$resp")
            [ "$next" = "null" ] && break
            offset=$next
            sleep 7 # stay under the endpoint's 10/min rate limit
          done

          # --- 2. real in-game player failures (Loki) -----------------------
          : > ingame.tsv
          ingame_note=""
          if [ -z "${GRAFANA_TOKEN:-}" ]; then
            echo "::warning::GRAFANA_READ_TOKEN is not set; skipping in-game failures."
            ingame_note="In-game failures were not checked (GRAFANA_READ_TOKEN is not set)."
          else
            end_ns=$(( $(date -u +%s) * 1000000000 ))
            start_ns=$(( end_ns - LOOKBACK_DAYS * 86400 * 1000000000 ))
            Q='{service_name="sound-clash-web", kind="log"} |~ "message=yt_(player|preload)_error" | logfmt | line_format "{{.timestamp}}\t{{.message}}\t{{.context_code}}\t{{.context_youtube_id}}\t{{.context_title}}\t{{.context_artist}}\t{{.context_game_code}}\t{{.page_url}}"'
            if lresp=$(curl -sS --fail-with-body --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
              -G "$GRAFANA_URL/api/datasources/proxy/uid/$LOKI_DS_UID/loki/api/v1/query_range" \
              -H "Authorization: Bearer $GRAFANA_TOKEN" \
              --data-urlencode "query=$Q" \
              --data-urlencode "start=$start_ns" \
              --data-urlencode "end=$end_ns" \
              --data-urlencode "limit=5000" \
              --data-urlencode "direction=forward"); then
              # tr -d '\r': a CRLF jq build would otherwise leave a stray CR on
              # the last field of each line.
              jq -r '.data.result[].values[][1]' <<<"$lresp" | tr -d '\r' | sort > ingame.tsv
            else
              echo "::warning::Loki query failed; in-game failures not checked."
              ingame_note="In-game failures could not be read from Grafana this run."
            fi
          fi

          dead_count=$(wc -l < dead.jsonl)
          unplayable_count=$(wc -l < unplayable.jsonl)
          unknown_count=$(wc -l < unknown.jsonl)
          ingame_count=$(wc -l < ingame.tsv)
          summary="checked=$checked dead=$dead_count unplayable=$unplayable_count unknown=$unknown_count flagged=$flagged cleared=$cleared canary_failed_pages=$canary_pages ingame_failures=$ingame_count dry_run=$DRY_RUN"
          echo "$summary"
          echo "Video scan: \`$summary\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$canary_pages" -gt 0 ]; then
            echo "::warning::YouTube refused the canary video on $canary_pages page(s); their verdicts were not flagged."
          fi

          issue=$(gh issue list --label dead-videos --state open \
            --json number --jq '.[0].number // empty')

          problems=$((dead_count + unplayable_count + unknown_count + ingame_count))
          if [ "$problems" -eq 0 ]; then
            if [ -n "$issue" ] && [ "$DRY_RUN" != "true" ]; then
              gh issue close "$issue" --comment "Weekly scan $(date -u +%F): checked $checked songs, every video plays and no game hit a player error in the last $LOOKBACK_DAYS days (restored $cleared). Closing."
            fi
            exit 0
          fi

          # --- 3. issue body --------------------------------------------------
          # Markdown-table-safe cell text.
          CELL='def cell: tostring | gsub("\\|"; "\\|") | gsub("[\r\n]"; " ");'
          {
            echo "The weekly video health scan found YouTube videos that don't play."
            echo
            echo "_Last scan: $(date -u '+%Y-%m-%d %H:%M UTC') — checked $checked songs: $dead_count deleted, $unplayable_count private or embedding disabled ($flagged newly flagged, $cleared restored), $unknown_count unclear; $ingame_count player errors in real games in the last $LOOKBACK_DAYS days._"
            if [ "$canary_pages" -gt 0 ]; then
              echo
              echo "> **Warning:** on $canary_pages page(s) YouTube also refused the known-good test video, so the backend was probably being blocked. Those songs are listed as unclear and nothing on those pages was flagged."
            fi
            if [ $((dead_count + unplayable_count)) -gt 0 ]; then
              echo
              echo "## Won't play (already skipped in games)"
              echo
              echo "The song picker skips these (mig 045), so no game breaks, but each one shrinks the playable pool. Edit the song with a working \`youtube_id\` (that clears the flag at once) or delete it."
              echo
              echo "| Song | Artist | Video | Problem | Song ID |"
              echo "|---|---|---|---|---|"
              jq -r "$CELL"' "| \(.title|cell) | \((.artist // "")|cell) | [\(.youtube_id)](https://www.youtube.com/watch?v=\(.youtube_id)) | deleted | `\(.id)` |"' dead.jsonl
              jq -r "$CELL"' "| \(.title|cell) | \((.artist // "")|cell) | [\(.youtube_id)](https://www.youtube.com/watch?v=\(.youtube_id)) | private or embedding disabled | `\(.id)` |"' unplayable.jsonl
            fi
            if [ "$ingame_count" -gt 0 ]; then
              echo
              echo "## Failed in real games (last $LOOKBACK_DAYS days)"
              echo
              echo "Errors the YouTube player raised on a host's screen. These are **not** skipped automatically, so open each video and replace it if it's broken. Error 101/150: the owner or a copyright claim blocks playback on other sites. 100: removed or private. 2: invalid video ID. 5: browser player error (often a one-off)."
              echo
              echo "| Song | Video | Error | Times | Games | Last seen (UTC) |"
              echo "|---|---|---|---|---|---|"
              jq -Rrs "$CELL"'
                def meaning: {"2": "invalid id", "5": "player error", "100": "removed or private", "101": "embedding blocked", "150": "embedding blocked"}[.] // "unknown";
                split("\n") | map(select(length > 0) | split("\t")
                  | {ts: .[0], where: (if .[1] == "yt_preload_error" then "next-song preload" else "live" end),
                     code: .[2], yid: .[3], title: .[4], artist: .[5],
                     # Only logs from #347 on carry context_game_code; older ones never do.
                     new: ((.[6] // "") != ""),
                     game: (if (.[6] // "") != "" then .[6] else ((.[7] // "") | split("/") | last) end)})
                | group_by([.yid, .new]) | sort_by(-length) | .[]
                | . as $g | $g[0] as $f
                | (if $f.yid == "" and $f.new then "_no song loaded yet (player error before the first song)_"
                   elif $f.yid == "" then "_unknown: logged before failures recorded the song_"
                   elif $f.title == "" then "_song not identified (open the video)_"
                   else "\($f.title|cell) — \($f.artist|cell)" end) as $song
                | (if $f.yid == "" then "—" else "[\($f.yid)](https://www.youtube.com/watch?v=\($f.yid))" end) as $video
                | ($g | map(.code) | unique | map("\(.) (\(meaning))") | join(", ")) as $codes
                | ($g | map(.where) | unique | join(", ")) as $where
                | ($g | map(.game) | unique | join(", ")) as $games
                | "| \($song) | \($video) | \($codes) · \($where) | \($g | length) | \($games) | \($g | map(.ts) | max) |"
              ' ingame.tsv
            fi
            if [ -n "$ingame_note" ]; then
              echo
              echo "_${ingame_note}_"
            fi
            if [ "$unknown_count" -gt 0 ]; then
              echo
              echo "<details><summary>Unclear answers for $unknown_count song(s) (400/429/5xx/timeout): not flagged, worth an occasional look</summary>"
              echo
              echo "| Song | Artist | Video | Song ID |"
              echo "|---|---|---|---|"
              jq -r "$CELL"' "| \(.title|cell) | \((.artist // "")|cell) | [\(.youtube_id)](https://www.youtube.com/watch?v=\(.youtube_id)) | `\(.id)` |"' unknown.jsonl
              echo
              echo "</details>"
            fi
          } > issue_body.md

          if [ "$DRY_RUN" = "true" ]; then
            echo "::group::[dry-run] issue body (no issue created or edited)"
            cat issue_body.md
            echo "::endgroup::"
            { echo; cat issue_body.md; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          title="YouTube videos that don't play (auto-maintained)"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --title "$title" --body-file issue_body.md
            gh issue comment "$issue" --body "Scan $(date -u +%F): $dead_count deleted, $unplayable_count private/embed-disabled ($flagged newly flagged), $cleared restored, $unknown_count unclear, $ingame_count in-game player errors; $checked songs checked. Body updated."
          else
            gh label create dead-videos \
              --description "Catalog songs whose YouTube video doesn't play" \
              --color D93F0B 2>/dev/null || true
            gh issue create \
              --title "$title" \
              --label dead-videos \
              --body-file issue_body.md
          fi
