name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    # "closed" is here only so the preview-teardown job can fire; the default
    # set is opened/synchronize/reopened, and naming any type replaces it, so
    # all four must be listed. Jobs guard on github.event.action accordingly.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + type + test
    # Nothing to test when a PR merely closes; that event exists for teardown.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          # cache-dependency-path is repo-root-relative (setup-node is a JS
          # action; it ignores defaults.run.working-directory), so it must
          # name frontend/package-lock.json, not package-lock.json.
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Reject skipped tests
        run: |
          if grep -rEn "(it|test)\.skip\(|@pytest\.mark\.skip|xfail" src/; then
            echo "::error::Found skipped tests; banned per docs/testing-strategy.md §6"
            exit 1
          fi

      - name: vitest with coverage
        run: npm run test:coverage

      - name: Verify no service-role key leaked into bundle
        run: |
          npm run build
          if grep -rE "SUPABASE_SERVICE_ROLE" dist/ 2>/dev/null; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY appears in frontend bundle"
            exit 1
          fi

      - name: Bundle-size budget (gzipped JS)
        run: |
          # T7.6 / T-BundleBudget: fail the PR on an accidental JS bundle-size
          # regression. Dependency-free (repo rule bans size-limit/bundlesize):
          # sums the per-file gzipped size of every emitted dist/assets/*.js and
          # compares against a fixed budget. Reuses the dist/ built by the
          # preceding "Verify no service-role key leaked" step (no rebuild).
          # Measured 2026-07-11: 350037 bytes. Budget 410000 = ~17% headroom.
          # Raise BUDGET deliberately (in a PR) when an intentional feature
          # grows the bundle; an accidental jump trips this and must be explained.
          BUDGET=410000
          total=0
          for f in dist/assets/*.js; do
            size=$(gzip -c "$f" | wc -c)
            total=$((total + size))
          done
          echo "gzipped JS: ${total} bytes (budget: ${BUDGET})"
          if [ "$total" -gt "$BUDGET" ]; then
            echo "::error::Frontend JS bundle ${total} bytes exceeds budget ${BUDGET} bytes"
            exit 1
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: always()
        with:
          files: frontend/coverage/lcov.info
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  deploy:
    name: deploy (Cloudflare Pages)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: |
          if [ -z "${{ secrets.CF_API_TOKEN }}" ]; then
            echo "::warning::CF_API_TOKEN not set; skipping deploy"
            exit 0
          fi
          npx wrangler@latest pages deploy dist --project-name=sound-clash --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

  # ---------------------------------------------------------------------------
  # Per-PR preview deployment.
  #
  # Deliberately `needs: test`, so a preview URL only ever exists for a PR whose
  # lint / types / tests / coverage / bundle budget are green. A red PR getting
  # no link is a feature, not a gap.
  #
  # Cost: nothing. Cloudflare's free plan documents an unlimited number of
  # *active* preview deployments, and the repo is public so Actions minutes are
  # unmetered. Cloudflare's docs do not say whether a Direct Upload (what
  # `wrangler pages deploy` does, as opposed to a Cloudflare-run Git build)
  # counts against the 500-builds/month quota; either way this repo's deploy
  # rate is an order of magnitude under that cap.
  #
  # The preview talks to the PRODUCTION API and Supabase project (see
  # frontend/.env.preview for why that is safe, and why its telemetry keys are
  # blank). FastAPI admits the preview origin only because CORS_ORIGIN_REGEX is
  # set on Render; if game creation fails with a CORS error in a preview, that
  # env var is the first thing to check.
  # ---------------------------------------------------------------------------
  preview:
    name: preview (Cloudflare Pages)
    needs: test
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
      - run: npm run build:preview
      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # Empty on a fork PR, where secrets are withheld: skip, don't fail.
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::warning::CF_API_TOKEN not set; skipping preview deploy"
            exit 0
          fi
          npx wrangler@latest pages deploy dist \
            --project-name=sound-clash \
            --branch="pr-${PR_NUMBER}"
          url="https://pr-${PR_NUMBER}.sound-clash.pages.dev"
          echo "### Preview: [${url}](${url})" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview deployed to ${url}"

  # ---------------------------------------------------------------------------
  # Tear the preview down when the PR closes (merged or not).
  #
  # Hygiene rather than cost control - unlimited previews are free - so every
  # failure here is a warning, never a red X on a PR that already merged fine.
  # `force=true` is required to delete a deployment that still holds the branch
  # alias; without it Cloudflare rejects the delete.
  # ---------------------------------------------------------------------------
  teardown-preview:
    name: teardown preview (Cloudflare Pages)
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Delete this PR's preview deployments
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          if [ -z "${CF_TOKEN}" ] || [ -z "${CF_ACCOUNT}" ]; then
            echo "::warning::Cloudflare credentials not set; nothing to tear down"
            exit 0
          fi
          branch="pr-${PR_NUMBER}"
          api="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/sound-clash/deployments"

          # The list endpoint cannot filter by branch, so page through and match
          # on deployment_trigger.metadata.branch ourselves.
          ids=""
          page=1
          while [ "${page}" -le 20 ]; do
            resp=$(curl -sS -H "Authorization: Bearer ${CF_TOKEN}" "${api}?page=${page}&per_page=100")
            if [ "$(printf '%s' "${resp}" | jq -r '.success')" != "true" ]; then
              echo "::warning::Listing deployments failed: $(printf '%s' "${resp}" | jq -c '.errors')"
              exit 0
            fi
            if [ "$(printf '%s' "${resp}" | jq '.result | length')" -eq 0 ]; then
              break
            fi
            matched=$(printf '%s' "${resp}" \
              | jq -r --arg b "${branch}" '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id')
            if [ -n "${matched}" ]; then
              ids="${ids}${matched}"$'\n'
            fi
            page=$((page + 1))
          done

          count=$(printf '%s' "${ids}" | grep -c . || true)
          if [ "${count}" -eq 0 ]; then
            echo "No preview deployments found for branch ${branch}"
            exit 0
          fi
          echo "Deleting ${count} preview deployment(s) for ${branch}"

          failed=0
          for id in ${ids}; do
            out=$(curl -sS -X DELETE -H "Authorization: Bearer ${CF_TOKEN}" "${api}/${id}?force=true")
            if [ "$(printf '%s' "${out}" | jq -r '.success')" = "true" ]; then
              echo "  deleted ${id}"
            else
              echo "::warning::Failed to delete ${id}: $(printf '%s' "${out}" | jq -c '.errors')"
              failed=$((failed + 1))
            fi
          done
          echo "Torn down $((count - failed))/${count} deployment(s) for ${branch}"
