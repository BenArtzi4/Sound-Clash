<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Sound Clash link-preview card — "Orange knockout".

      1200x630, rasterised by `node tools/og-image/render.mjs`. This file is the
      source of truth for the design; everything here mirrors the shipped app
      (docs/planning/ui-redesign/01-design-system.md):

        - Flat colour, no gradients. The system bans them, and a flat field also
          survives the heavy JPEG re-encoding chat apps apply to previews.
        - The ground is --accent #ff7a00 and every mark on it is BLACK. White or
          cream on this orange measures ~2:1 and fails; black is 8.04:1.
        - The lockup is the app's own wordmark, rebuilt with the same numbers as
          frontend/src/components/Logo.module.css: mark at 1.15em, 0.45em gap,
          Anton uppercase, letter-spacing 0.04em, line-height 1. The four bar
          paths are copied verbatim from EqualizerMark in components/icons.tsx.

      Fonts are loaded from frontend/public/fonts over file:// so the build has
      no network dependency. render.mjs asserts both faces actually parsed
      before it screenshots — a silent fallback to a system face would not be
      obvious in the output, so it is made loud instead.
    -->
    <style>
      @font-face {
        font-family: "Anton";
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src: url("../../frontend/public/fonts/anton-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: block;
        src: url("../../frontend/public/fonts/instrument-sans-latin.woff2") format("woff2");
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #ff7a00; /* --accent */
        font-family: "Instrument Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* The wordmark, same proportions as the in-app <Logo>. */
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 0.45em;
        line-height: 1;
        font-size: 136px;
        color: #000; /* --accent-ink — never cream on orange */
      }
      .mark {
        display: inline-flex;
        font-size: 1.15em;
      }
      .mark svg {
        display: block;
      }
      .text {
        font-family: "Anton", sans-serif;
        font-weight: 400;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        line-height: 1;
      }

      .tagline {
        font-size: 30px;
        font-weight: 600;
        color: rgba(0, 0, 0, 0.72);
      }
    </style>
  </head>
  <body>
    <div class="wordmark">
      <span class="mark">
        <svg
          viewBox="0 0 24 24"
          width="1em"
          height="1em"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M5 15v-6" />
          <path d="M9.5 19V5" />
          <path d="M14 17V7" />
          <path d="M18.5 15v-6" />
        </svg>
      </span>
      <span class="text">Sound Clash</span>
    </div>

    <p class="tagline">Name the song. Buzz first.</p>
  </body>
</html>
