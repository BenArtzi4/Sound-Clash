<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Audit</title>
<link rel="stylesheet" href="review.css">
</head>
<body>
<header class="top">
  <div class="topRow">
    <h1>Catalog audit</h1>
    <div id="progress" class="progress"></div>
    <div id="saveState" class="saveState"></div>
  </div>
  <nav id="tabs" class="tabs" aria-label="Issue type"></nav>
  <div class="filters">
    <div class="seg" id="statusSeg" role="group" aria-label="Status">
      <button data-status="pending" class="on">To review</button>
      <button data-status="approved">Approved</button>
      <button data-status="rejected">Rejected</button>
      <button data-status="all">All</button>
    </div>
    <input id="q" type="search" placeholder="Search title / artist / note…" dir="auto">
    <label class="chk"><input id="highOnly" type="checkbox"> Must-fix only</label>
    <span class="keys">Keys: <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>a</kbd> approve · <kbd>r</kbd> reject · <kbd>space</kbd> play</span>
  </div>
</header>
<main id="list" class="list"></main>
<template id="emptyTpl"><p class="empty">Nothing here. Pick another tab or status.</p></template>
<script src="https://www.youtube.com/iframe_api"></script>
<script src="review.js"></script>
</body>
</html>
